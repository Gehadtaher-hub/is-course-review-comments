<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة توصيفات المقررات</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:#f3f8f6;color:#163a5f}.hero{position:relative;min-height:320px;padding:36px 18px 90px;text-align:center;color:#fff;background:linear-gradient(120deg,#075fa8,#2498d8);overflow:hidden}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;border:55px solid #ffffff0a}.hero:before{width:350px;height:350px;left:-150px;top:-220px}.hero:after{width:280px;height:280px;right:-100px;bottom:-180px}.logo{position:absolute;right:max(22px,calc((100vw - 1160px)/2));top:24px;width:112px;height:112px;border-radius:50%;object-fit:contain;background:#fff;padding:5px;border:4px solid #dfac32;box-shadow:0 12px 28px #003c2c55;z-index:3}.hero h1{position:relative;margin:35px 0 8px;font-size:clamp(30px,4.5vw,52px)}.hero p{position:relative;font-size:18px;font-weight:700}.wrap{max-width:1160px;margin:-62px auto 45px;padding:0 18px;position:relative}.panel{background:#fff;border-radius:26px;padding:26px;box-shadow:0 20px 55px #123f3325}.filters{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:7px}select,input{width:100%;height:54px;border:1px solid #d8e6e1;border-radius:14px;padding:0 14px;font-size:16px;background:#fbfdfc}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.stat{background:linear-gradient(145deg,#fbfdfc,#edf7f3);border:1px solid #dce8e4;border-radius:18px;padding:18px;text-align:center}.stat:before{content:"";display:block;width:50px;height:5px;border-radius:5px;background:#dfa51f;margin:0 auto 10px}.stat b{display:block;color:#0878bd;font-size:31px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #e0e9e6;padding-top:20px}.head small:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2aa56f;margin-left:7px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;margin-top:18px}.card{position:relative;background:#fff;border:1px solid #dbe7e3;border-radius:19px;padding:19px;box-shadow:0 7px 20px #173e350d;overflow:hidden}.card:after{content:"";position:absolute;right:0;top:0;bottom:0;width:5px;background:linear-gradient(#087158,#dfa51f)}.top{display:flex;justify-content:space-between;gap:12px}.code{direction:ltr;background:#e7f5ef;color:#087158;padding:7px 11px;border-radius:10px;font-weight:800}.status{padding:7px 11px;border-radius:999px;font-weight:800;font-size:13px}.warn{background:#fff2d8;color:#ac6500}.ok{background:#e6f6ed;color:#14724c}.bad{background:#fdeaea;color:#a52c2c}.card h2{font-size:20px;margin:12px 0}.meta{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#f3f7f5;border:1px solid #e1eae6;border-radius:999px;padding:7px 10px;font-size:13px;unicode-bidi:plaintext}details{margin-top:15px;padding-top:13px;border-top:1px dashed #d7e3df}summary{cursor:pointer;color:#087158;font-weight:800}.sheet{margin-top:12px;border:1px solid #e0e9e6;border-radius:14px;overflow:hidden}.sheet-title{padding:11px 14px;background:#edf7f3;color:#087158;font-weight:800}.items{padding:6px 13px;max-height:520px;overflow:auto}.item{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:10px 0;border-bottom:1px dashed #e2e9e6;line-height:1.8}.item:last-child{border-bottom:0}.num{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#fff1cf;color:#916000;font-weight:800}.empty{grid-column:1/-1;text-align:center;padding:55px;color:#71807b}footer{text-align:center;padding:25px;color:#71807b}@media(max-width:720px){.logo{width:76px;height:76px;right:14px;top:14px;border-width:3px}.hero h1{padding-right:70px}.filters,.stats,.cards{grid-template-columns:1fr}.panel{padding:17px}.head{align-items:flex-start;flex-direction:column}}

      <label class="radio-option"><input type="radio" name="revisionStatus" value="تم تنفيذ جميع التعديلات" required><span>تم تنفيذ جميع التعديلات</span></label>
      <label class="radio-option"><input type="radio" name="revisionStatus" value="تم تنفيذ جزء من التعديلات"><span>تم تنفيذ جزء من التعديلات</span></label>
      <label class="radio-option"><input type="radio" name="revisionStatus" value="أحتاج توضيحًا من لجنة المراجعة"><span>أحتاج توضيحًا من لجنة المراجعة</span></label>
      <label class="notes-label" for="revisionNotes">ملاحظات عضو هيئة التدريس</label>
      <textarea id="revisionNotes" rows="5" placeholder="اكتب ملاحظاتك هنا..."></textarea>
      <div id="revisionMessage" class="revision-message" aria-live="polite"></div>
      <div class="modal-actions"><button type="button" class="btn-cancel" id="modalCancel">إلغاء</button><button type="submit" class="btn-submit" id="revisionSubmit">إرسال التحديث</button></div>
    </form>
  </div>
</div>

<script>
let DATA=[];const $=id=>document.getElementById(id),staff=$('staff'),search=$('search'),cards=$('cards');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function st(v){v=String(v||'');return v.includes('تعديلات')?'warn':v.includes('اعتماد')||v.includes('تمت المراجعة')?'ok':v.includes('لم تبدأ')?'bad':''}function date(v){if(v===null||v===undefined||v==='')return'';let t=String(v).trim();if(!t||t==='0'||t==='-')return'';if(/^\d+(\.\d+)?$/.test(t)){let d=new Date(Date.UTC(1899,11,30)+Number(t)*86400000);return new Intl.DateTimeFormat('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'}).format(d)}let d=new Date(t);return Number.isNaN(d.getTime())?t:new Intl.DateTimeFormat('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}function notes(text){let raw=String(text||'').replace(/\\n/g,'\n').trim();if(!raw)return'';let a=raw.split(/\n+/).map(x=>x.trim()).filter(x=>x&&!/^[012]$/.test(x));return `<div class="sheet"><div class="sheet-title">الملاحظات والإجراءات المطلوبة</div><div class="items">${a.map((x,i)=>`<div class="item"><span class="num">${i+1}</span><span>${esc(x.replace(/^(?:\d{1,2}[.)-]|[-*•])\s*/,''))}</span></div>`).join('')}</div></div>`}function deliveryStatus(receipt,review){
 const raw=String(receipt||'').trim();
 if(raw && raw!=='-' && raw!=='0') return raw;
 const reviewText=String(review||'').trim();
 if(reviewText && !reviewText.includes('لم تبدأ')) return 'تم الاستلام';
 return 'لم يتم الاستلام';
}
function render(){
  const selectedName=String(staff.value||'').trim();
  if(!selectedName){
    document.getElementById('total').textContent='0';
    document.getElementById('needs').textContent='0';
    document.getElementById('approved').textContent='0';
    document.getElementById('heading').textContent='يرجى اختيار اسم';
    cards.innerHTML='<div class="empty">اختر اسمًا لعرض المقررات والملاحظات.</div>';
    return;
  }
let n=selectedName,q=search.value.trim().toLowerCase(),a=DATA.filter(x=>x.staff===n&&(!q||(x.code+' '+x.course).toLowerCase().includes(q)));$('total').textContent=a.length;$('needs').textContent=a.filter(x=>(x.review||'').includes('تعديلات')).length;$('approved').textContent=a.filter(x=>(x.review||'').includes('اعتماد')||(x.review||'').includes('تمت المراجعة')).length;$('heading').textContent=n||'يرجى اختيار اسم';if(!n){cards.innerHTML='<div class="empty">اختر اسمًا لعرض المقررات والملاحظات.</div>';return}cards.innerHTML=a.map(x=>`<article class="card"><div class="top"><span class="code">${esc(x.code)}</span><span class="status ${st(x.review)}">${esc(x.review||'لم تبدأ')}</span></div><h2>${esc(x.course)}</h2><div class="meta"><span class="tag">الترم: ${esc(x.term||'-')}</span><span class="tag">التصنيف: ${esc(x.category||'-')}</span><span class="tag">حالة الاستلام: ${esc(deliveryStatus(x.receipt,x.review))}</span>${date(x.receiptDate)?`<span class="tag">تاريخ الاستلام: ${date(x.receiptDate)}</span>`:''}${date(x.reviewDate)?`<span class="tag">تاريخ المراجعة: ${date(x.reviewDate)}</span>`:''}</div><details><summary>${x.comments?'عرض الملاحظات والإجراءات المطلوبة':'لا توجد ملاحظات مسجلة'}</summary>${notes(x.comments)}</details>${x.completionStatus?`<div class="completion-box">${esc(x.completionStatus)}${x.completionDate?` · ${esc(x.completionDate)}`:""}</div>`:""}<button type="button" class="revision-btn" data-code="${esc(x.code)}" data-course="${esc(x.course)}">تحديث حالة تنفيذ التعديلات</button></article>`).join('')||'<div class="empty">لا توجد مقررات مطابقة.</div>'}async function load(){try{let r=await fetch('https://api.github.com/repos/Gehadtaher-hub/is-course-review-comments/issues/1?x='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let issue=await r.json();DATA=JSON.parse(issue.body||'[]').map(x=>({...x,staff:x.staff==='أ.د. عبد المنعم عبدالحميد عبد الحمد مجاهد'?'أ.د. عبد المنعم عبدالحميد عبد الحميد مجاهد':x.staff}));[...new Set(DATA.map(x=>x.staff))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ar')).forEach(n=>{let o=document.createElement('option');o.value=o.textContent=n;staff.appendChild(o)});$('updated').textContent='تم تحميل أحدث البيانات تلقائيًا';render()}catch(e){cards.innerHTML='<div class="empty">تعذر تحميل البيانات. أعد تحميل الصفحة.</div>';$('updated').textContent='فشل التحميل'}}staff.addEventListener('change',render);search.addEventListener('input',render);load();

const REVISION_FLOW_URL = 'https://default5d3edc643c814c4089c6d3f5e1095f.71.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/2e4253898262481797ced85b7324baa7/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=6OWRxLR622Gh2eTfX26TQreHIj2WlDTc96jEn3lTmxk';
let activeRevisionCourse=null;
const revisionModal=document.getElementById('revisionModal');
const revisionForm=document.getElementById('revisionForm');
if(!revisionModal||!revisionForm){console.error('Revision dialog could not be initialized.');}
function openRevisionModal(code,course){
 activeRevisionCourse={code,course};
 document.getElementById('modalCourseCode').textContent=code;
 document.getElementById('modalCourseName').textContent=course;
 revisionForm.reset();
 const msg=document.getElementById('revisionMessage');msg.textContent='';msg.className='revision-message';
 revisionModal.classList.add('open');revisionModal.setAttribute('aria-hidden','false');
}
function closeRevisionModal(){revisionModal.classList.remove('open');revisionModal.setAttribute('aria-hidden','true');activeRevisionCourse=null;}
document.addEventListener('click',e=>{const b=e.target.closest('.revision-btn');if(b)openRevisionModal(b.dataset.code,b.dataset.course)});
document.getElementById('modalClose').addEventListener('click',closeRevisionModal);
document.getElementById('modalCancel').addEventListener('click',closeRevisionModal);
revisionModal.addEventListener('click',e=>{if(e.target===revisionModal)closeRevisionModal()});
revisionForm.addEventListener('submit',async e=>{
 e.preventDefault();
 const msg=document.getElementById('revisionMessage');
 const selected=revisionForm.querySelector('input[name="revisionStatus"]:checked');
 if(!selected||!activeRevisionCourse)return;
 if(REVISION_FLOW_URL.includes('PASTE_YOUR_')){msg.textContent='يجب إضافة رابط Power Automate داخل ملف index.html أولًا.';msg.className='revision-message error';return;}
 const btn=document.getElementById('revisionSubmit');btn.disabled=true;btn.textContent='جارٍ الإرسال...';msg.textContent='';
 try{
  await fetch(REVISION_FLOW_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({staff:staff.value,code:activeRevisionCourse.code,status:selected.value,notes:document.getElementById('revisionNotes').value.trim()})});
  msg.textContent='تم إرسال التحديث. سيظهر في ملف المتابعة بعد ثوانٍ.';msg.className='revision-message ok';
  setTimeout(closeRevisionModal,1400);
 }catch(err){msg.textContent='تعذر إرسال التحديث. تأكد من تشغيل التدفق ومن صحة رابط Power Automate.';msg.className='revision-message error';console.error('Revision submission failed:',err)}finally{btn.disabled=false;btn.textContent='إرسال التحديث'}
});
</script>
</body></html>
